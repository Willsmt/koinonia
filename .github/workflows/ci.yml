name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: koinonia
          POSTGRES_PASSWORD: koinonia
          POSTGRES_DB: koinonia
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-dummy-secret-key
      DB_NAME: koinonia
      DB_USER: koinonia
      DB_PASSWORD: koinonia
      DB_HOST: localhost
      DB_PORT: 5432
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Poetry
        run: pipx install poetry==2.4.1
      - name: Install dependencies (main + dev)
        run: poetry install --with dev --no-root --no-interaction
      - name: Ruff check
        run: poetry run ruff check .
      - name: Run test suite
        run: poetry run python manage.py test
