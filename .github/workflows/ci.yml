name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lint:
    name: Ruff (lint + format)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Install Poetry
        run: pipx install poetry==2.4.1
      - name: Install dependencies (main + dev)
        run: poetry install --with dev --no-root --no-interaction
      - name: Ruff check
        run: poetry run ruff check .
      - name: Ruff format check
        run: poetry run ruff format --check .

  test:
    name: Suíte de testes (Postgres real)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: koinonia
          POSTGRES_PASSWORD: koinonia
          POSTGRES_DB: koinonia
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-dummy-secret-key
      DB_NAME: koinonia
      DB_USER: koinonia
      DB_PASSWORD: koinonia
      DB_HOST: localhost
      DB_PORT: 5432
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Install Poetry
        run: pipx install poetry==2.4.1
      - name: Install dependencies (main + dev)
        run: poetry install --with dev --no-root --no-interaction
      - name: Run test suite
        run: poetry run python manage.py test
