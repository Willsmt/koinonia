[project]
name = "koinonia-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Willsmt",email = "willian_marthins@hotmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "django (>=6.0.7,<7.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "python-decouple (>=3.8,<4.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "phonenumbers (>=9.0.35,<10.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.0,<0.17.0)"
]

[tool.ruff]
line-length = 88
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I"]
extend-select = []

[tool.ruff.lint.pycodestyle]
max-line-length = 100